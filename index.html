      --radius: 14px;

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #fdf4ff 0%, #f0fdfa 100%);
      color: var(--text); min-height: 100vh; padding: 14px;
      display: flex; flex-direction: column; align-items: center;
    }
    .container { width: 100%; max-width: 680px; }
    header { text-align: center; margin: 10px 0 16px; }
    h1 { font-size: 1.3rem; font-weight: 700; color: #1e293b; display: flex; align-items: center; justify-content: center; gap: 6px; }
    p.subtitle { font-size: 0.82rem; color: var(--text-muted); margin-top: 4px; }
    .controls {
      background: var(--card-bg); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7); border-radius: var(--radius);
      padding: 10px; margin-bottom: 14px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      display: flex; flex-direction: column; gap: 8px;
    }
    .search-box input {
      width: 100%; padding: 9px 12px; font-size: 0.88rem;
      border: 1px solid #e2e8f0; border-radius: 9px; outline: none; background: #fff;
    }
    .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.15); }
    .tabs { display: flex; gap: 6px; overflow-x: auto; }
    .tab-btn {
      border: none; background: #f1f5f9; color: var(--text-muted);
      padding: 6px 12px; border-radius: 16px; font-size: 0.8rem; cursor: pointer; white-space: nowrap;
    }
    .tab-btn.active { background: var(--primary); color: #fff; font-weight: 600; }
    .sticker-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px;
    }
    .sticker-card {
      background: var(--card-bg); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 12px;
      padding: 8px 6px; display: flex; flex-direction: column; align-items: center;
      cursor: pointer; transition: transform 0.15s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .sticker-card:active { transform: scale(0.93); }
    .sticker-img-wrap {
      width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; margin-bottom: 4px;
    }
    .sticker-img-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .sticker-name {
      font-size: 0.72rem; color: var(--text-muted); text-align: center;
      width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: rgba(30, 41, 59, 0.92); color: #fff; padding: 8px 18px; border-radius: 20px;
      font-size: 0.82rem; opacity: 0; transition: all 0.25s ease; z-index: 999; pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>

const grid = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');
const tabs = document.querySelectorAll('.tab-btn');
const toast = document.getElementById('toast');
let currentCategory = 'all';
let searchQuery = '';

function render() {
  grid.innerHTML = '';
  const filtered = STICKERS.filter(item => {
    const matchCategory = (currentCategory === 'all' || item.tag === currentCategory);
    const matchSearch = (!searchQuery || item.name.includes(searchQuery) || item.k.includes(searchQuery));
    return matchCategory && matchSearch;
  });

  if (filtered.length === 0) {
    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 40px 0; font-size: 0.85rem;">没有找到匹配的表情 🐾</div>';
    return;
  }

  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = 'sticker-card';
    card.innerHTML = `
      <div class="sticker-img-wrap">
        <img src="${item.url}" alt="${item.name}" loading="lazy">
      </div>
      <div class="sticker-name">${item.name}</div>
    `;
    card.onclick = () => copyMarkdown(item.name, item.url);
    grid.appendChild(card);
  });
}

function copyMarkdown(name, url) {
  const md = `![${name}](${url})`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(md).then(() => showToast(`已复制：${name} ✨`)).catch(() => fallbackCopy(md, name));
  } else {
    fallbackCopy(md, name);
  }
}

function fallbackCopy(text, name) {
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta);
  ta.select(); document.execCommand('copy');
  document.body.removeChild(ta);
  showToast(`已复制：${name} ✨`);
}

function showToast(msg) {
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
}

searchInput.addEventListener('input', (e) => {
  searchQuery = e.target.value.trim();
  render();
});

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentCategory = tab.dataset.category;
    render();
  });
});

render();
</script>
