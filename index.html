const grid = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');
const tabs = document.querySelectorAll('.tab-btn');
const toast = document.getElementById('toast');
let currentCategory = 'all';
let searchQuery = '';

function render() {
  grid.innerHTML = '';
  const filtered = STICKERS.filter(item => {
    const matchCategory = (currentCategory === 'all' || item.tag === currentCategory);
    const matchSearch = (!searchQuery || item.name.includes(searchQuery) || item.k.includes(searchQuery));
    return matchCategory && matchSearch;
  });
  if (!filtered.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:40px 0;">没有找到匹配的表情 🐾</div>';
    return;
  }
  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = 'sticker-card';
    card.innerHTML = `<div class="sticker-img-wrap"><img src="${item.url}" alt="${item.name}" referrerpolicy="no-referrer" loading="lazy"></div><div class="sticker-name">${item.name}</div>`;
    card.onclick = () => {
      const md = `![${item.name}](${item.url})`;
      navigator.clipboard.writeText(md).then(() => showToast(`已复制：${item.name} ✨`)).catch(() => {
        const ta = document.createElement('textarea'); ta.value = md; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        showToast(`已复制：${item.name} ✨`);
      });
    };
    grid.appendChild(card);
  });
}

function showToast(msg) {
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
}

searchInput.addEventListener('input', e => { searchQuery = e.target.value.trim(); render(); });
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentCategory = tab.dataset.category;
    render();
  });
});
render();
</script>
