<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>&#x5C0F;&#x7EA2;&#x4E66;&#x7B14;&#x8BB0;&#x9884;&#x89C8; &#x1F360;</title>
  <style>
    :root{--primary:#ff2442;--bg:linear-gradient(135deg,#fff5f5 0%,#fff0f0 100%);--card-bg:rgba(255,255,255,0.95);--muted:#888;--radius:16px;}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:var(--bg);min-height:100vh;padding:16px;display:flex;flex-direction:column;align-items:center;}
    .container{width:100%;max-width:600px;}
    header{text-align:center;margin:12px 0 20px;}
    h1{font-size:1.3rem;font-weight:700;color:#1a1a1a;}
    p.sub{font-size:0.82rem;color:var(--muted);margin-top:4px;}
    .input-row{display:flex;gap:8px;margin-bottom:16px;}
    .input-row input{flex:1;padding:10px 14px;font-size:0.9rem;border:1.5px solid #ffd0d6;border-radius:10px;outline:none;background:#fff;}
    .input-row input:focus{border-color:var(--primary);}
    .input-row button{padding:10px 18px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:0.9rem;cursor:pointer;white-space:nowrap;}
    .skeleton{background:var(--card-bg);border-radius:var(--radius);border:1.5px solid #ffe0e3;overflow:hidden;animation:pulse 1.4s ease-in-out infinite;}
    .sk-cover{width:100%;height:200px;background:#f5e0e3;}
    .sk-body{padding:14px;display:flex;flex-direction:column;gap:10px;}
    .sk-line{height:14px;background:#f0dde0;border-radius:6px;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.55}}
    .xhs-card{background:var(--card-bg);border-radius:var(--radius);border:1.5px solid #ffd0d6;overflow:hidden;box-shadow:0 4px 20px rgba(255,36,66,0.06);text-decoration:none;display:block;color:inherit;}
    .cover-wrap{position:relative;width:100%;padding-top:75%;overflow:hidden;background:#f5e0e3;}
    .cover-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
    .img-count{position:absolute;top:8px;right:10px;background:rgba(0,0,0,0.45);color:#fff;font-size:0.75rem;padding:2px 8px;border-radius:10px;}
    .card-body{padding:12px 14px 14px;}
    .card-title{font-size:1rem;font-weight:700;color:#1a1a1a;margin-bottom:6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .card-desc{font-size:0.82rem;color:#555;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px;}
    .card-meta{display:flex;align-items:center;justify-content:space-between;}
    .card-author{font-size:0.78rem;color:var(--muted);}
    .card-stats{display:flex;gap:10px;font-size:0.75rem;color:var(--muted);}
    .xhs-logo{font-size:0.75rem;font-weight:700;color:var(--primary);}
    .comments{margin-top:14px;}
    .comments h3{font-size:0.85rem;color:var(--muted);margin-bottom:8px;}
    .comment-item{background:#fff8f8;border-radius:10px;padding:8px 12px;margin-bottom:7px;}
    .comment-user{font-size:0.75rem;font-weight:600;color:var(--primary);margin-bottom:2px;}
    .comment-text{font-size:0.82rem;color:#333;line-height:1.5;}
    .status{text-align:center;padding:24px 0;color:var(--muted);font-size:0.85rem;}
    .error{color:#ff4466;}
    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(30,30,30,0.9);color:#fff;padding:8px 18px;border-radius:20px;font-size:0.82rem;opacity:0;transition:all 0.25s ease;z-index:999;pointer-events:none;}
    #toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>&#x1F360; &#x5C0F;&#x7EA2;&#x4E66;&#x7B14;&#x8BB0;&#x9884;&#x89C8;</h1>
    <p class="sub">&#x7C98;&#x8D34;&#x94FE;&#x63A5;&#xFF0C;&#x5C0F;&#x793C;&#x54E5;&#x54E5;&#x5C31;&#x80FD;&#x770B;&#x5230;&#x7B14;&#x8BB0;&#x5185;&#x5BB9;&#x548C;&#x56FE;&#x7247;</p>
  </header>
  <div class="input-row">
    <input type="text" id="urlInput" placeholder="&#x7C98;&#x8D34;&#x5C0F;&#x7EA2;&#x4E66;&#x94FE;&#x63A5;&#x6216;&#x77ED;&#x94FE;&#x2026;">
    <button onclick="fetchNote()">&#x8BFB;&#x53D6;</button>
  </div>
  <div id="result"></div>
</div>
<div id="toast"></div>
<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(function(){t.classList.remove('show');},1800);}
document.getElementById('urlInput').addEventListener('keydown',function(e){if(e.key==='Enter')fetchNote();});

async function fetchNote(){
  var rawUrl=document.getElementById('urlInput').value.trim();
  if(!rawUrl)return showToast('\u8BF7\u5148\u7C98\u8D34\u5C0F\u7EA2\u4E66\u94FE\u63A5');
  var result=document.getElementById('result');
  result.innerHTML='<div class="skeleton"><div class="sk-cover"></div><div class="sk-body"><div class="sk-line" style="width:70%"></div><div class="sk-line" style="width:90%"></div><div class="sk-line" style="width:55%"></div></div></div><div class="status">&#x1F4D5; \u6B63\u5728\u8BFB\u53D6\u7B14\u8BB0\u2026</div>';
  try{
    var resp=await fetch(rawUrl,{redirect:'follow',mode:'cors',headers:{'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1'}});
    var finalUrl=resp.url||rawUrl;
    var html=await resp.text();
    var match=html.match(/window\.__INITIAL_STATE__\s*=\s*([\s\S]+?)<\/script>/);
    if(!match)throw new Error('\u6CA1\u6709\u62FF\u5230\u7B14\u8BB0\u6570\u636E\uFF0C\u8BF7\u5728\u5C0F\u7EA2\u4E66 App \u91CC\u6253\u5F00\u7B14\u8BB0\u540E\u590D\u5236\u7F51\u9875\u94FE\u63A5');
    var raw=match[1].trim().replace(/;\s*$/,'').replace(/undefined/g,'null');
    var state=JSON.parse(raw);
    var note=null;
    try{note=state.noteData.data.noteData;}catch(e){}
    if(!note)try{note=state.noteData.normalNotePreloadData.note;}catch(e){}
    if(!note)throw new Error('\u672A\u627E\u5230\u7B14\u8BB0\u5185\u5BB9');
    var images=(note.imageList||[]).map(function(img){
      var u=img.urlDefault||img.url||'';
      if(typeof u==='object'&&u)u=u.url||'';
      return String(u).replace(/\\u002F/g,'/').replace(/^\/\//,'https://');
    }).filter(Boolean);
    var interact=note.interactInfo||{};
    var list=(state.comment&&state.comment.comments&&state.comment.comments.list)||[];
    var comments=list.slice(0,5).map(function(c){return{user:(c.userInfo&&c.userInfo.nickname)||'',content:c.content||'',ip:c.ipLocation||''};});
    var cover=images[0]||'';
    var m2=finalUrl.match(/(?:explore|discovery)\/([a-f0-9]{20,})/);
    var realUrl=m2?'https://www.xiaohongshu.com/explore/'+m2[1]:finalUrl;
    var html2='<a class="xhs-card" href="'+esc(realUrl)+'" target="_blank"><div class="cover-wrap">';
    if(cover)html2+='<img src="'+esc(cover)+'" alt="\u5C01\u9762" onerror="this.style.display=\'none\'">';
    if(images.length>1)html2+='<span class="img-count">&#x1F5BC; '+images.length+'</span>';
    html2+='</div><div class="card-body"><div class="card-title">'+esc(note.title||'\uFF08\u65E0\u6807\u9898\uFF09')+'</div><div class="card-desc">'+esc(note.desc||'')+'</div><div class="card-meta"><span class="card-author">@'+esc((note.user&&note.user.nickname)||'')+'</span><div class="card-stats"><span>&#x2764;&#xFE0F; '+(interact.likedCount||0)+'</span><span>&#x1F4AC; '+(interact.commentCount||0)+'</span><span>&#x2B50; '+(interact.collectedCount||0)+'</span></div><span class="xhs-logo">\u5C0F\u7EA2\u4E66</span></div></div></a>';
    if(comments.length){
      html2+='<div class="comments"><h3>\u70ED\u95E8\u8BC4\u8BBA</h3>';
      comments.forEach(function(c){html2+='<div class="comment-item"><div class="comment-user">'+esc(c.user)+(c.ip?' <span style="color:#aaa;font-size:0.72rem">'+esc(c.ip)+'</span>':'')+'</div><div class="comment-text">'+esc(c.content)+'</div></div>';});
      html2+='</div>';
    }
    result.innerHTML=html2;
  }catch(e){
    var isCors=e.message.indexOf('fetch')>=0||e.message.indexOf('NetworkError')>=0||e.message.indexOf('CORS')>=0||e.message.indexOf('Failed')>=0;
    result.innerHTML=isCors
      ?'<div class="status error">&#x274C; \u8DE8\u57DF\u88AB\u62E6\u3002\u8BF7\u5728\u5C0F\u7EA2\u4E66 App \u91CC\u6253\u5F00\u7B14\u8BB0\uFF0C\u5206\u4EAB \u2192 \u590D\u5236\u94FE\u63A5\uFF0C\u518D\u7C98\u8D34\u5230\u8FD9\u91CC\u3002</div>'
      :'<div class="status error">&#x274C; '+esc(e.message)+'</div>';
  }
}
</script>
</body>
</html>
