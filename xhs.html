<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小红书笔记预览 🍠</title>
  <style>
    :root {
      --primary: #ff2442;
      --bg: linear-gradient(135deg, #fff5f5 0%, #fff0f0 100%);
      --card-bg: rgba(255,255,255,0.95);
      --text: #1a1a1a;
      --muted: #888;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      background: var(--bg); min-height: 100vh; padding: 16px;
      display: flex; flex-direction: column; align-items: center;
    }
    .container { width: 100%; max-width: 600px; }
    header { text-align: center; margin: 12px 0 20px; }
    h1 { font-size: 1.3rem; font-weight: 700; color: #1a1a1a; }
    p.sub { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
    .input-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .input-row input {
      flex: 1; padding: 10px 14px; font-size: 0.9rem;
      border: 1.5px solid #ffd0d6; border-radius: 10px; outline: none; background: #fff;
    }
    .input-row input:focus { border-color: var(--primary); }
    .input-row button {
      padding: 10px 18px; background: var(--primary); color: #fff;
      border: none; border-radius: 10px; font-size: 0.9rem; cursor: pointer; white-space: nowrap;
    }
    .skeleton {
      background: var(--card-bg); border-radius: var(--radius);
      border: 1.5px solid #ffe0e3; overflow: hidden;
      box-shadow: 0 4px 20px rgba(255,36,66,0.06);
      animation: pulse 1.4s ease-in-out infinite;
    }
    .sk-cover { width: 100%; height: 200px; background: #f5e0e3; }
    .sk-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .sk-line { height: 14px; background: #f0dde0; border-radius: 6px; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.55} }
    .xhs-card {
      background: var(--card-bg); border-radius: var(--radius);
      border: 1.5px solid #ffd0d6; overflow: hidden;
      box-shadow: 0 4px 20px rgba(255,36,66,0.06);
      cursor: pointer; text-decoration: none; display: block; color: inherit;
    }
    .xhs-card:active { opacity: 0.85; }
    .cover-wrap { position: relative; width: 100%; padding-top: 56.25%; overflow: hidden; background: #f5e0e3; }
    .cover-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .img-count {
      position: absolute; top: 8px; right: 10px;
      background: rgba(0,0,0,0.45); color: #fff; font-size: 0.75rem;
      padding: 2px 8px; border-radius: 10px; backdrop-filter: blur(4px);
    }
    .card-body { padding: 12px 14px 14px; }
    .card-title { font-size: 1rem; font-weight: 700; color: #1a1a1a; margin-bottom: 6px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-desc { font-size: 0.82rem; color: #555; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 10px; }
    .card-meta { display: flex; align-items: center; justify-content: space-between; }
    .card-author { font-size: 0.78rem; color: var(--muted); }
    .card-stats { display: flex; gap: 10px; font-size: 0.75rem; color: var(--muted); }
    .xhs-logo { font-size: 0.75rem; font-weight: 700; color: var(--primary); letter-spacing: -0.5px; }
    .comments { margin-top: 14px; }
    .comments h3 { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
    .comment-item { background: #fff8f8; border-radius: 10px; padding: 8px 12px; margin-bottom: 7px; }
    .comment-user { font-size: 0.75rem; font-weight: 600; color: var(--primary); margin-bottom: 2px; }
    .comment-text { font-size: 0.82rem; color: #333; line-height: 1.5; }
    .status { text-align: center; padding: 24px 0; color: var(--muted); font-size: 0.85rem; }
    .error { color: #ff4466; }
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(30,30,30,0.9); color: #fff;
      padding: 8px 18px; border-radius: 20px; font-size: 0.82rem;
      opacity: 0; transition: all 0.25s ease; z-index: 999; pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>🍠 小红书笔记预览</h1>
    <p class="sub">粘贴链接，小礼哥哥就能看到笔记内容和图片</p>
  </header>
  <div class="input-row">
    <input type="text" id="urlInput" placeholder="粘贴小红书链接或短链…">
    <button onclick="fetchNote()">读取</button>
  </div>
  <div id="result"></div>
</div>
<div id="toast"></div>
<script>
const API = 'https://xhs-backend.2563490036.workers.dev';

async function fetchNote() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) return showToast('请先粘贴小红书链接');
  const result = document.getElementById('result');
  result.innerHTML = `
    <div class="skeleton">
      <div class="sk-cover"></div>
      <div class="sk-body">
        <div class="sk-line" style="width:70%"></div>
        <div class="sk-line" style="width:90%"></div>
        <div class="sk-line" style="width:60%"></div>
      </div>
    </div>
    <div class="status">📕 正在读取笔记…</div>
  `;
  try {
    const res = await fetch(API + '/api/xhs-card', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url})
    });
    const data = await res.json();
    if (!data.ok) {
      result.innerHTML = `<div class="status error">❌ ${data.error || '读取失败，请检查链接'}</div>`;
      return;
    }
    const note = data.note;
    const cover = note.images && note.images[0] ? note.images[0] : '';
    const countBadge = note.imageCount > 1 ? `<span class="img-count">🖼 ${note.imageCount}</span>` : '';
    result.innerHTML = `
      <a class="xhs-card" href="${note.url}" target="_blank">
        <div class="cover-wrap">
          ${cover ? `<img src="${cover}" alt="封面" onerror="this.style.display='none'">` : ''}
          ${countBadge}
        </div>
        <div class="card-body">
          <div class="card-title">${escHtml(note.title || '（无标题）')}</div>
          <div class="card-desc">${escHtml(note.desc || '')}</div>
          <div class="card-meta">
            <span class="card-author">@${escHtml(note.author)}</span>
            <div class="card-stats">
              <span>❤️ ${note.likedCount}</span>
              <span>💬 ${note.commentCount}</span>
              <span>⭐ ${note.collectedCount}</span>
            </div>
            <span class="xhs-logo">小红书</span>
          </div>
        </div>
      </a>
      ${note.comments && note.comments.length ? `
        <div class="comments">
          <h3>热门评论</h3>
          ${note.comments.map(c => `
            <div class="comment-item">
              <div class="comment-user">${escHtml(c.user)} ${c.ipLocation ? '<span style="color:#aaa;font-weight:400">' + escHtml(c.ipLocation) + '</span>' : ''}</div>
              <div class="comment-text">${escHtml(c.content)}</div>
            </div>
          `).join('')}
        </div>
      ` : ''}
    `;
  } catch(e) {
    result.innerHTML = `<div class="status error">❌ 网络错误：${e.message}</div>`;
  }
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.tt);
  window.tt = setTimeout(() => t.classList.remove('show'), 1800);
}

document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') fetchNote();
});
</script>
</body>
</html>
