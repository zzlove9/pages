<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小红书笔记预览 🍠</title>
  <style>
    :root {
      --primary: #ff2442;
      --bg: linear-gradient(135deg, #fff5f5 0%, #fff0f0 100%);
      --card-bg: rgba(255,255,255,0.95);
      --text: #1a1a1a;
      --muted: #888;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      background: var(--bg); min-height: 100vh; padding: 16px;
      display: flex; flex-direction: column; align-items: center;
    }
    .container { width: 100%; max-width: 600px; }
    header { text-align: center; margin: 12px 0 20px; }
    h1 { font-size: 1.3rem; font-weight: 700; color: #1a1a1a; }
    p.sub { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
    .input-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .input-row input {
      flex: 1; padding: 10px 14px; font-size: 0.9rem;
      border: 1.5px solid #ffd0d6; border-radius: 10px; outline: none; background: #fff;
    }
    .input-row input:focus { border-color: var(--primary); }
    .input-row button {
      padding: 10px 18px; background: var(--primary); color: #fff;
      border: none; border-radius: 10px; font-size: 0.9rem; cursor: pointer; white-space: nowrap;
    }
    .skeleton {
      background: var(--card-bg); border-radius: var(--radius);
      border: 1.5px solid #ffe0e3; overflow: hidden;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .sk-cover { width: 100%; height: 200px; background: #f5e0e3; }
    .sk-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .sk-line { height: 14px; background: #f0dde0; border-radius: 6px; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.55} }
    .xhs-card {
      background: var(--card-bg); border-radius: var(--radius);
      border: 1.5px solid #ffd0d6; overflow: hidden;
      box-shadow: 0 4px 20px rgba(255,36,66,0.06);
      text-decoration: none; display: block; color: inherit;
    }
    .cover-wrap { position: relative; width: 100%; padding-top: 75%; overflow: hidden; background: #f5e0e3; }
    .cover-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .img-count {
      position: absolute; top: 8px; right: 10px;
      background: rgba(0,0,0,0.45); color: #fff; font-size: 0.75rem;
      padding: 2px 8px; border-radius: 10px;
    }
    .card-body { padding: 12px 14px 14px; }
    .card-title { font-size: 1rem; font-weight: 700; color: #1a1a1a; margin-bottom: 6px; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-desc { font-size: 0.82rem; color: #555; line-height: 1.55;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 10px; }
    .card-meta { display: flex; align-items: center; justify-content: space-between; }
    .card-author { font-size: 0.78rem; color: var(--muted); }
    .card-stats { display: flex; gap: 10px; font-size: 0.75rem; color: var(--muted); }
    .xhs-logo { font-size: 0.75rem; font-weight: 700; color: var(--primary); }
    .comments { margin-top: 14px; }
    .comments h3 { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
    .comment-item { background: #fff8f8; border-radius: 10px; padding: 8px 12px; margin-bottom: 7px; }
    .comment-user { font-size: 0.75rem; font-weight: 600; color: var(--primary); margin-bottom: 2px; }
    .comment-text { font-size: 0.82rem; color: #333; line-height: 1.5; }
    .status { text-align: center; padding: 24px 0; color: var(--muted); font-size: 0.85rem; }
    .error { color: #ff4466; }
    .tip { background: #fff8f8; border: 1px solid #ffd0d6; border-radius: 10px; padding: 12px 14px;
      font-size: 0.82rem; color: #666; line-height: 1.6; margin-bottom: 14px; }
    .tip b { color: var(--primary); }
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(30,30,30,0.9); color: #fff;
      padding: 8px 18px; border-radius: 20px; font-size: 0.82rem;
      opacity: 0; transition: all 0.25s ease; z-index: 999; pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>🍠 小红书笔记预览</h1>
    <p class="sub">粘贴链接，小礼哥哥就能看到笔记内容和图片</p>
  </header>

  <div class="tip">
    使用方式：粘贴小红书链接，点「读取」。短链（xhslink.cn）请先在小红书里复制<b>完整网页链接</b>（包含 explore/或 discovery/ 的那种）再粘贴。
  </div>

  <div class="input-row">
    <input type="text" id="urlInput" placeholder="粘贴小红书笔记链接…">
    <button onclick="fetchNote()">读取</button>
  </div>
  <div id="result"></div>
</div>
<div id="toast"></div>

<script>
async function fetchNote() {
  const rawUrl = document.getElementById('urlInput').value.trim();
  if (!rawUrl) return showToast('请先粘贴小红书链接');

  const result = document.getElementById('result');
  result.innerHTML = `
    <div class="skeleton">
      <div class="sk-cover"></div>
      <div class="sk-body">
        <div class="sk-line" style="width:70%"></div>
        <div class="sk-line" style="width:90%"></div>
        <div class="sk-line" style="width:55%"></div>
      </div>
    </div>
    <div class="status">📕 正在读取笔记…</div>
  `;

  // 提取笔记 ID
  const idMatch = rawUrl.match(/(?:explore|discovery)\/([a-f0-9]+)/);
  if (!idMatch) {
    result.innerHTML = `<div class="status error">❌ 请粘贴包含 explore/ 或 discovery/ 的完整小红书链接</div>`;
    return;
  }
  const noteId = idMatch[1];
  const noteUrl = `https://www.xiaohongshu.com/explore/${noteId}`;

  try {
    // 直接请求小红书页面（浏览器在国内，访问没有限制）
    const resp = await fetch(noteUrl, {
      headers: {
        'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1'
      },
      mode: 'cors'
    });
    const html = await resp.text();

    const match = html.match(/window\.__INITIAL_STATE__\s*=\s*([\s\S]+?)<\/script>/);
    if (!match) throw new Error('没有拿到笔记数据，请尝试完整链接');

    let raw = match[1].trim().replace(/;\s*$/, '');
    raw = raw.replace(/undefined/g, 'null');
    const state = JSON.parse(raw);

    // 尝试两种路径
    let note = null;
    try { note = state.noteData.data.noteData; } catch(e) {}
    if (!note) try { note = state.noteData.normalNotePreloadData.note; } catch(e) {}
    if (!note) throw new Error('未找到笔记内容，请尝试完整链接');

    const imageList = note.imageList || [];
    const images = imageList.map(img => {
      let u = img.urlDefault || img.url || '';
      if (typeof u === 'object' && u) u = u.url || '';
      u = String(u).replace(/\\u002F/g, '/').replace(/^(\/\/)/, 'https://');
      return u;
    }).filter(Boolean);

    const interact = note.interactInfo || {};
    const commentsRaw = state.comment?.comments?.list || [];
    const comments = commentsRaw.slice(0, 5).map(c => ({
      user: c.userInfo?.nickname || '',
      content: c.content || '',
      ip: c.ipLocation || ''
    }));

    const cover = images[0] || '';
    const countBadge = images.length > 1 ? `<span class="img-count">🖼 ${images.length}</span>` : '';

    result.innerHTML = `
      <a class="xhs-card" href="${noteUrl}" target="_blank">
        <div class="cover-wrap">
          ${cover ? `<img src="${esc(cover)}" alt="封面" onerror="this.style.display='none'">` : ''}
          ${countBadge}
        </div>
        <div class="card-body">
          <div class="card-title">${esc(note.title || '（无标题）')}</div>
          <div class="card-desc">${esc(note.desc || '')}</div>
          <div class="card-meta">
            <span class="card-author">@${esc(note.user?.nickname || '')}</span>
            <div class="card-stats">
              <span>❤️ ${interact.likedCount || 0}</span>
              <span>💬 ${interact.commentCount || 0}</span>
              <span>⭐ ${interact.collectedCount || 0}</span>
            </div>
            <span class="xhs-logo">小红书</span>
          </div>
        </div>
      </a>
      ${comments.length ? `
        <div class="comments">
          <h3>热门评论</h3>
          ${comments.map(c => `
            <div class="comment-item">
              <div class="comment-user">${esc(c.user)}${c.ip ? ' <span style="color:#aaa;font-size:0.72rem">' + esc(c.ip) + '</span>' : ''}</div>
              <div class="comment-text">${esc(c.content)}</div>
            </div>
          `).join('')}
        </div>
      ` : ''}
    `;

  } catch(e) {
    // 如果跨域被拦，给出友好提示
    if (e.message.includes('Failed to fetch') || e.message.includes('NetworkError') || e.message.includes('CORS')) {
      result.innerHTML = `<div class="status error">❌ 浏览器跨域限制。请尝试在小红书 App 里复制网页链接（包含 explore/ 的完整地址）再粘贴。</div>`;
    } else {
      result.innerHTML = `<div class="status error">❌ ${esc(e.message)}</div>`;
    }
  }
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.tt);
  window.tt = setTimeout(() => t.classList.remove('show'), 1800);
}

document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') fetchNote();
});
</script>
</body>
</html>
